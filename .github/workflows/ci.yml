# Every pull request must pass this before it is merged (and before Vercel deploys main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tok
          POSTGRES_PASSWORD: tok
          POSTGRES_DB: tok_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database and secret — never real credentials
      DATABASE_URL: postgres://tok:tok@localhost:5432/tok_ci
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Lint (incl. module boundary rules)
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Apply all migrations to a fresh database
        run: yarn payload migrate

      - name: Every collection change has a migration
        run: |
          yarn payload migrate:create ci_check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Collections changed without a migration. Run: yarn payload migrate:create <name>"
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Integration tests (access rules)
        run: yarn test:int

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests (onboarding)
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
